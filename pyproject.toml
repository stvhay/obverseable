[project]
name = "obverseable"
version = "0.1.0"
description = "MCP server that gives Claude full access to Firefox DevTools via RDP"
requires-python = ">=3.13"
dependencies = [
    "geckordp>=1.0",
    "mcp[cli]>=1.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "pyjwt>=2.0",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
